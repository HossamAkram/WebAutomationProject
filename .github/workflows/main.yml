name: Run Web Automation Tests
on:
  push:
    branches: [ main ]
jobs:
  run-selenium-tests:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v3
    - name: ☕ Set up Java 21
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: 🚀 Install Microsoft Edge
      run: |
        curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
        sudo install -o root -g root -m 644 microsoft.gpg /etc/apt/trusted.gpg.d/
        sudo sh -c 'echo "deb [arch=amd64] https://packages.microsoft.com/repos/edge stable main" > /etc/apt/sources.list.d/microsoft-edge.list'
        sudo apt-get update
        sudo apt-get install -y microsoft-edge-stable
    - name: 🚀 Install Edge WebDriver
      run: |
        EDGE_VERSION=$(microsoft-edge --version | cut -d ' ' -f 3)
        wget -q "https://msedgedriver.azureedge.net/${EDGE_VERSION}/edgedriver_linux64.zip"
        unzip edgedriver_linux64.zip
        sudo mv msedgedriver /usr/bin/msedgedriver
        sudo chmod +x /usr/bin/msedgedriver
    - name: 🧪 Run Tests with Maven
      run: mvn clean test
